name: Build iTop image

on:
  workflow_dispatch:
    inputs:
      itop_version:
        description: "iTop version label used in the image tag, e.g. 3.3.0-1"
        required: true
        default: "3.3.0-1"
      itop_download_url:
        description: "Direct URL of the iTop release zip"
        required: true
        default: "https://github.com/Combodo/iTop/releases/download/3.3.0-1/iTop-3.3.0-1-21956.zip"
      target:
        description: "Image flavour: base (no MySQL, use external DB) or full (bundled MySQL)"
        required: true
        type: choice
        options:
          - base
          - full
        default: base
      platforms:
        description: "Target platforms"
        required: true
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64
        default: linux/amd64
      push_latest:
        description: "Also tag as latest-<target>"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/itop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate download URL
        env:
          URL: ${{ inputs.itop_download_url }}
        run: |
          set -euo pipefail
          code=$(curl -sSL -o /dev/null -w '%{http_code}' "$URL")
          echo "HEAD/GET $URL -> $code"
          [ "$code" = "200" ] || { echo "::error::download URL is not reachable"; exit 1; }

      - name: Set up QEMU
        if: contains(inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        env:
          VERSION: ${{ inputs.itop_version }}
          TARGET: ${{ inputs.target }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail
          image="${REGISTRY}/${IMAGE_NAME,,}"
          tags="${image}:${VERSION}-${TARGET}"
          if [ "${PUSH_LATEST}" = "true" ]; then
            tags="${tags},${image}:latest-${TARGET}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          echo "primary=${image}:${VERSION}-${TARGET}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: ${{ inputs.target }}
          platforms: ${{ inputs.platforms }}
          pull: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            ITOP_DOWNLOAD_URL=${{ inputs.itop_download_url }}
          labels: |
            org.opencontainers.image.title=iTop ${{ inputs.itop_version }} (${{ inputs.target }})
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ inputs.itop_version }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Built image"
            echo ""
            echo "- image: \`${{ steps.meta.outputs.primary }}\`"
            echo "- iTop: ${{ inputs.itop_version }}"
            echo "- target: ${{ inputs.target }}"
            echo "- platforms: ${{ inputs.platforms }}"
            echo "- source: ${{ inputs.itop_download_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
